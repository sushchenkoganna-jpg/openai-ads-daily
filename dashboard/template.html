<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OpenAI Ads daily</title>
<style>
:root{color-scheme:light;--bg:#f6f6f3;--card:#fff;--fg:#1c1c1a;--mut:#6c6c66;--line:#e5e4de;--forms:#2f6fdb;--func:#16a085;--oth:#9a9a94;--good:#1a8f4c;--bad:#c8372d;--warn:#fbf3e2}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){color-scheme:dark;--bg:#141413;--card:#1e1e1c;--fg:#ededea;--mut:#9c9c96;--line:#32322e;--forms:#6b9cf0;--func:#3cc7a6;--oth:#77776f;--good:#4cc27e;--bad:#ef6b61;--warn:#352f22}}
:root[data-theme=dark]{color-scheme:dark;--bg:#141413;--card:#1e1e1c;--fg:#ededea;--mut:#9c9c96;--line:#32322e;--forms:#6b9cf0;--func:#3cc7a6;--oth:#77776f;--good:#4cc27e;--bad:#ef6b61;--warn:#352f22}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif}
main{max-width:1240px;margin:0 auto;padding:22px 16px 56px}
h1{font-size:22px;margin:0}.sub{color:var(--mut);font-size:12px}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:14px 0 0}
.seg{display:inline-flex;flex-wrap:wrap;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--card)}
.seg button{font:inherit;padding:6px 12px;border:0;background:none;color:var(--fg);cursor:pointer;border-right:1px solid var(--line)}
.seg button:last-child{border-right:0}.seg button.on{background:var(--fg);color:var(--bg)}
.bar select,.bar input{font:inherit;padding:5px 8px;border:1px solid var(--line);background:var(--card);color:var(--fg);border-radius:8px;max-width:100%}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:16px}
@media (max-width:760px){.kpis{grid-template-columns:repeat(2,1fr)}}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px 14px}
.kpi .l{color:var(--mut);font-size:12px}.kpi .v{font-size:22px;font-weight:650;font-variant-numeric:tabular-nums;margin:2px 0}
.kpi.main .v{font-size:28px}
.d{font-size:12px;font-variant-numeric:tabular-nums}.up{color:var(--good)}.dn{color:var(--bad)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}@media (max-width:900px){.grid2{grid-template-columns:1fr}}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px;margin-top:14px;min-width:0}
.card h2{font-size:15px;margin:0 0 10px;display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.card h2 button{font:inherit;font-size:12px;padding:3px 9px;border:1px solid var(--line);background:none;color:var(--fg);border-radius:6px;cursor:pointer}
svg{width:100%;height:auto;display:block}svg text{fill:var(--mut);font-size:11px}
.tw{overflow-x:auto}table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums}
th,td{padding:6px 8px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
th{color:var(--mut);font-weight:500;font-size:12px;cursor:pointer;user-select:none}
th:first-child,td:first-child{text-align:left;white-space:normal;min-width:200px}
tr.tot td{font-weight:650}.note{background:var(--warn);padding:7px 11px;border-radius:8px;font-size:12px;margin-top:12px}
.lg{display:flex;flex-wrap:wrap;gap:12px;font-size:12px;color:var(--mut);font-weight:400}.lg i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:4px;vertical-align:-1px}
.tag{display:inline-block;font-size:11px;padding:1px 7px;border-radius:10px;color:#fff;margin-right:6px}
.bar2{height:6px;border-radius:3px;background:var(--line);overflow:hidden;min-width:60px}.bar2 b{display:block;height:100%}
.err{background:var(--warn);padding:16px;border-radius:10px;margin-top:16px}
</style>
</head>
<body><main>
<div style="display:flex;justify-content:space-between;align-items:flex-start;gap:10px;flex-wrap:wrap"><div><h1>OpenAI Ads · pdfFiller</h1><div class="sub" id="sub"></div></div>
<div class="seg" id="theme"><button data-th="auto">Auto</button><button data-th="light">Light</button><button data-th="dark">Dark</button></div></div>
<div class="bar"><div class="seg" id="per"></div>
  <label class="sub">from <input type="date" id="d1"></label><label class="sub">to <input type="date" id="d2"></label></div>
<div class="bar"><span class="sub">Compare</span><select id="cm"><option value="prev">Previous period</option><option value="week">Same days a week earlier</option><option value="month">Same days a month earlier</option><option value="year">Same period last year</option><option value="custom">Custom</option></select>
  <span id="cbox"><label class="sub">from <input type="date" id="c1"></label> <label class="sub">to <input type="date" id="c2"></label></span></div>
<div class="bar"><div class="seg" id="typ"></div>
  <select id="fc"></select><span class="sub" id="cmp"></span></div>
<div id="body">
<div class="kpis" id="kpis"></div>
<div class="note" id="note"></div>
<div class="card"><h2>Forms vs Functions</h2><div class="tw" id="tt"></div></div>
<div class="grid2">
  <div class="card"><h2>Daily spend <span class="lg" id="lg1"></span></h2><div id="ch1"></div></div>
  <div class="card"><h2>Daily conversions <span class="lg" id="lg2"></span></h2><div id="ch2"></div></div>
</div>
<div class="card"><h2>CPA, rolling 7 days <span class="lg" id="lg3"></span></h2><div id="ch3"></div></div>
<div class="card"><h2>Campaigns <button data-t="tc">CSV</button></h2><div class="tw" id="tc"></div></div>
<div class="card"><h2>Conversions by country <button data-t="tk">CSV</button></h2><div class="sub" style="margin:-4px 0 8px">OpenAI reports only conversions by country; the API does not split spend or clicks by country.</div><div class="tw" id="tk"></div></div>
</div>
</main>
<script>
(()=>{const set=t=>{if(t==="auto")document.documentElement.removeAttribute("data-theme");else document.documentElement.setAttribute("data-theme",t);
  document.querySelectorAll("[data-th]").forEach(b=>b.classList.toggle("on",b.dataset.th===t));try{localStorage.setItem("theme",t)}catch(e){}};
  let t="auto";try{t=localStorage.getItem("theme")||"auto"}catch(e){}set(t);
  document.querySelectorAll("[data-th]").forEach(b=>b.onclick=()=>set(b.dataset.th))})();
let D=/*__DATA__*/null;
(async()=>{
const $=s=>document.getElementById(s);
if(!D){try{D=await (await fetch('/__fn/data')).json()}catch(e){D={error:String(e)}}}
if(!D||D.error||!D.c){$("body").innerHTML=`<div class="err">Could not load data: ${D&&(D.error+" "+(D.detail||""))}</div>`;return}
const fmt=(v,d=0)=>v==null||!isFinite(v)?"—":v.toLocaleString("en-US",{minimumFractionDigits:d,maximumFractionDigits:d});
const usd=v=>v==null||!isFinite(v)?"—":"$"+fmt(v,Math.abs(v)<100?2:0);
const pct=v=>v==null||!isFinite(v)?"—":fmt(v*100,v<.1?2:1)+"%";
const addD=(s,n)=>{const d=new Date(s+"T00:00:00Z");d.setUTCDate(d.getUTCDate()+n);return d.toISOString().slice(0,10)};
const span=(a,b)=>Math.round((new Date(b)-new Date(a))/864e5)+1;
const TYPES=["Forms","Functions","Other"],TC={"Forms":"var(--forms)","Functions":"var(--func)","Other":"var(--oth)"};
const typeOf=n=>/function/i.test(n)?"Functions":/form/i.test(n)?"Forms":"Other";
const CT=D.camps.map(typeOf);const usedTypes=TYPES.filter(t=>CT.includes(t));
const dates=[...new Set(D.c.map(r=>r[0]))].sort();const LAST=D.meta.last_day||dates[dates.length-1];const FIRST=dates[0];
const st={d1:addD(LAST,-6),d2:LAST,t:"",c:"",sort:["spend",-1],p:"7",cm:"prev",c1:"",c2:""};
const addM=(s,n)=>{const d=new Date(s+"T00:00:00Z");d.setUTCMonth(d.getUTCMonth()+n);return d.toISOString().slice(0,10)};
const z=()=>({imp:0,clk:0,spend:0,conv:0});
const add=(o,r)=>{o.imp+=r[2];o.clk+=r[3];o.spend+=r[4];o.conv+=r[5];return o};   // r = data row [date, camp, imp, clk, spend, conv]
const der=o=>({...o,ctr:o.imp?o.clk/o.imp:null,cpc:o.clk?o.spend/o.clk:null,cpa:o.conv?o.spend/o.conv:null,cvr:o.clk?o.conv/o.clk:null});
const keep=ci=>(st.t===""||CT[ci]===st.t)&&(st.c===""||ci===+st.c);
const inA=d=>d>=st.d1&&d<=st.d2;
function prev(){const n=span(st.d1,st.d2);
  if(st.cm==="week")return[addD(st.d1,-7),addD(st.d2,-7)];
  if(st.cm==="month")return[addM(st.d1,-1),addM(st.d2,-1)];
  if(st.cm==="year")return[addM(st.d1,-12),addM(st.d2,-12)];
  if(st.cm==="custom"&&st.c1&&st.c2)return st.c1<=st.c2?[st.c1,st.c2]:[st.c2,st.c1];
  return[addD(st.d1,-n),addD(st.d1,-1)]}
function dl(a,b,lowGood){if(a==null||b==null||!b)return'<span class="d sub">—</span>';const x=a/b-1;const good=lowGood?x<0:x>0;
  return `<span class="d ${lowGood===2||Math.abs(x)<.005?"":good?"up":"dn"}">${x>0?"+":""}${fmt(x*100,1)}%</span>`}
const KP=[["spend","Spend",usd,2,1],["conv","Conversions (trials)",v=>fmt(v,v%1?1:0),0,1],["cpa","CPA",usd,1,1],["cvr","CVR click→trial",pct,0,1],
  ["clk","Clicks",v=>fmt(v),0],["cpc","CPC",usd,1],["ctr","CTR",pct,0],["imp","Impressions",v=>fmt(v),0]];
function agg(p1,p2){const A=z(),B=z(),T={},C={};
  for(const r of D.c){if(!keep(r[1]))continue;const a=inA(r[0]),b=r[0]>=p1&&r[0]<=p2;if(!a&&!b)continue;
    const t=CT[r[1]],tt=T[t]||(T[t]={a:z(),b:z()}),cc=C[r[1]]||(C[r[1]]={a:z(),b:z()}),s=a?"a":"b";
    add(a?A:B,r);add(tt[s],r);add(cc[s],r)}
  return{A:der(A),B:der(B),T,C}}
function render(){
  const[p1,p2]=prev(),g=agg(p1,p2);
  $("kpis").innerHTML=KP.map(([k,l,f,lg,m])=>`<div class="kpi${m?" main":""}"><div class="l">${l}</div><div class="v">${f(g.A[k])}</div><div>${dl(g.A[k],g.B[k],lg)} <span class="sub">prev ${f(g.B[k])}</span></div></div>`).join("");
  $("cmp").textContent=`${st.d1} – ${st.d2} vs ${p1} – ${p2}`;
  $("note").style.display=st.d2>=addD(LAST,-1)?"":"none";
  $("note").textContent=`${addD(LAST,-1)} and ${LAST} are still maturing: OpenAI attributes conversions up to 30 days after the click; each daily update rewrites the last 7 days.`;
  types(g);charts();camps(g);countries(p1,p2);
}
function types(g){
  const tot=g.A.spend||0,n=x=>fmt(x,x%1?1:0);
  const rows=usedTypes.filter(t=>g.T[t]).map(t=>({t,a:der(g.T[t].a),b:der(g.T[t].b)}));
  const row=(name,a,b,share,col)=>`<tr${col?"":' class="tot"'}><td>${col?`<span class="tag" style="background:${col}">&nbsp;</span>`:""}${name}</td><td>${usd(a.spend)}</td>
    <td>${share==null?"":`<div style="display:flex;gap:6px;align-items:center;justify-content:flex-end">${pct(share)}<div class="bar2"><b style="width:${share*100}%;background:${col}"></b></div></div>`}</td>
    <td>${dl(a.spend,b.spend,2)}</td><td>${n(a.conv)}</td><td>${dl(a.conv,b.conv,0)}</td><td>${usd(a.cpa)}</td><td>${dl(a.cpa,b.cpa,1)}</td><td>${pct(a.ctr)}</td><td>${pct(a.cvr)}</td><td>${usd(a.cpc)}</td></tr>`;
  $("tt").innerHTML=`<table><tr><th>Type</th><th>Spend</th><th>Spend share</th><th>Δ spend</th><th>Conv</th><th>Δ conv</th><th>CPA</th><th>Δ CPA</th><th>CTR</th><th>CVR</th><th>CPC</th></tr>`+
    rows.map(({t,a,b})=>row(t,a,b,tot?a.spend/tot:0,TC[t])).join("")+row("Total",g.A,g.B,null,null)+"</table>";
}
function series(a,b){   // days a..b, plus 6 days before a for the rolling CPA
  const days=[];for(let d=a;d<=b;d=addD(d,1))days.push(d);
  const by={};for(const r of D.c){if(!keep(r[1])||r[0]<addD(a,-6)||r[0]>b)continue;const k=r[0]+"|"+CT[r[1]];add(by[k]||(by[k]=z()),r)}
  return{days,get:(d,t)=>by[d+"|"+t]||z()}}
const PC="var(--mut)";
function prevLine(vals,P,lab,f,x,y){   // comparison period, aligned day by day with the selected one
  let s="",seg=[];const flush=()=>{if(seg.length>1)s+=`<polyline fill="none" stroke="${PC}" stroke-width="2" stroke-dasharray="4 3" points="${seg.join(" ")}"/>`;seg=[]};
  vals.forEach((v,i)=>{if(v==null)return flush();seg.push(`${x(i)},${y(v)}`);s+=`<circle cx="${x(i)}" cy="${y(v)}" r="2.5" fill="${PC}"/><circle cx="${x(i)}" cy="${y(v)}" r="7" fill="transparent"><title>${P.days[i]} · ${lab}: ${f(v)}</title></circle>`});flush();return s}
function axis(W,H,L,R,T,B,max,f){let s="";for(let g=0;g<=4;g++){const v=max*g/4,y=T+(H-T-B)*(1-g/4);
  s+=`<line x1="${L}" x2="${W-R}" y1="${y}" y2="${y}" stroke="var(--line)"/><text x="${L-6}" y="${y+4}" text-anchor="end">${f(v)}</text>`}return s}
function nice(m){if(m<=0)return 1;const p=Math.pow(10,Math.floor(Math.log10(m))),n=m/p;return(n<=1?1:n<=2?2:n<=5?5:10)*p}
const shownTypes=()=>usedTypes.filter(t=>st.t===""||t===st.t);
const dlab=(S,i,every,W,L,w,H)=>i%every===0?`<text x="${L+w*i+w/2}" y="${H-8}" text-anchor="middle">${S.days[i].slice(8)}.${S.days[i].slice(5,7)}</text>`:"";
function bars(id,lgId,key,f){
  const[p1,p2]=prev(),S=series(st.d1,st.d2),P=series(p1,p2),n=S.days.length,W=600,H=240,L=52,R=10,T=10,B=26,w=(W-L-R)/n,ts=shownTypes();
  const sum=(X,d)=>ts.reduce((s,t)=>s+X.get(d,t)[key],0);
  const tot=S.days.map(d=>sum(S,d)),pv=S.days.map((_,i)=>P.days[i]?sum(P,P.days[i]):null);
  const mx=nice(Math.max(0,...tot,...pv.filter(v=>v!=null))),y=v=>T+(H-T-B)*(1-v/mx),x=i=>L+w*i+w/2;
  let s=`<svg viewBox="0 0 ${W} ${H}">`+axis(W,H,L,R,T,B,mx,f);
  S.days.forEach((d,i)=>{let acc=0;const inc=d>=addD(LAST,-1);for(const t of ts){const v=S.get(d,t)[key];if(!v)continue;
    s+=`<rect x="${L+w*i+w*.12}" y="${y(acc+v)}" width="${w*.76}" height="${y(acc)-y(acc+v)}" fill="${TC[t]}" opacity="${inc?.45:.9}"><title>${d} · ${t}: ${f(v)}</title></rect>`;acc+=v}
    s+=dlab(S,i,Math.ceil(n/8),W,L,w,H)});
  s+=prevLine(pv,P,"compare",f,x,y);
  $(id).innerHTML=s+"</svg>";$(lgId).innerHTML=ts.map(t=>`<span><i style="background:${TC[t]}"></i>${t}</span>`).join("")+`<span><i style="background:${PC}"></i>Compare ${p1} – ${p2}</span>`;
}
function cpaChart(){
  const[p1,p2]=prev(),S=series(st.d1,st.d2),P=series(p1,p2),n=S.days.length,W=1200,H=240,L=52,R=10,T=10,B=26,w=(W-L-R)/n,ts=shownTypes();
  const lines=ts.map(t=>({t,c:TC[t],set:[t]}));if(ts.length>1)lines.push({t:"Total",c:"var(--fg)",set:ts});
  const roll=(X,d,set)=>{let sp=0,cv=0;for(let j=0;j<7;j++)for(const t of set){const v=X.get(addD(d,-j),t);sp+=v.spend;cv+=v.conv}return cv?sp/cv:null};
  const vals=lines.map(l=>S.days.map(d=>roll(S,d,l.set))),pv=S.days.map((_,i)=>P.days[i]?roll(P,P.days[i],ts):null);
  const mx=nice(Math.max(1,...vals.flat().filter(v=>v!=null),...pv.filter(v=>v!=null))),y=v=>T+(H-T-B)*(1-v/mx),x=i=>L+w*i+w/2;
  let s=`<svg viewBox="0 0 ${W} ${H}">`+axis(W,H,L,R,T,B,mx,usd)+prevLine(pv,P,"compare CPA 7d",usd,x,y);
  lines.forEach((l,k)=>{const st_=`fill="none" stroke="${l.c}" stroke-width="${l.t==="Total"?2.5:2}"`;let seg=[];
    const flush=()=>{if(seg.length)s+=`<polyline ${st_} points="${seg.join(" ")}"/>`;seg=[]};
    vals[k].forEach((v,i)=>{if(v==null)return flush();seg.push(`${x(i)},${y(v)}`);s+=`<circle cx="${x(i)}" cy="${y(v)}" r="${n<=31?3:0}" fill="${l.c}"/><circle cx="${x(i)}" cy="${y(v)}" r="7" fill="transparent"><title>${S.days[i]} · ${l.t}: CPA 7d ${usd(v)}</title></circle>`});flush()});
  S.days.forEach((d,i)=>{s+=dlab(S,i,Math.ceil(n/14),W,L,w,H)});
  $("ch3").innerHTML=s+"</svg>";$("lg3").innerHTML=lines.map(l=>`<span><i style="background:${l.c}"></i>${l.t}</span>`).join("")+`<span><i style="background:${PC}"></i>${ts.length>1?"Total, compare":"Compare"} ${p1} – ${p2}</span>`;
}
function charts(){bars("ch1","lg1","spend",v=>"$"+fmt(v));bars("ch2","lg2","conv",v=>fmt(v));cpaChart()}
const COLS=[["type","Type"],["spend","Spend",usd],["dspend","Δ spend",null,2],["conv","Conv",v=>fmt(v,v%1?1:0)],["dconv","Δ conv",null,0],["cpa","CPA",usd],["dcpa","Δ CPA",null,1],
  ["clk","Clicks",v=>fmt(v)],["ctr","CTR",pct],["cpc","CPC",usd],["cvr","CVR",pct],["imp","Impr.",v=>fmt(v)]];
const TBL={};
function camps(g){
  const list=Object.entries(g.C).map(([k,o])=>{const a=der(o.a),b=der(o.b);return{name:D.camps[k],type:CT[k],...a,
    dspend:b.spend?a.spend/b.spend-1:null,dconv:b.conv?a.conv/b.conv-1:null,dcpa:a.cpa&&b.cpa?a.cpa/b.cpa-1:null,prev:b.spend}}).filter(r=>r.spend||r.conv||r.prev);
  const[sk,sd]=st.sort;list.sort((x,y)=>((x[sk]??-1e18)>(y[sk]??-1e18)?1:-1)*sd);TBL.tc=list;
  const cell=(r,[k,,f,lg])=>k==="type"?`<span class="tag" style="background:${TC[r.type]}">${r.type}</span>`:f?f(r[k]):r[k]==null?'<span class="d sub">—</span>':`<span class="d ${Math.abs(r[k])<.005?"":lg===2?"":(lg?r[k]<0:r[k]>0)?"up":"dn"}">${r[k]>0?"+":""}${fmt(r[k]*100,1)}%</span>`;
  $("tc").innerHTML=`<table><tr><th data-k="name">Campaign</th>${COLS.map(c=>`<th data-k="${c[0]}">${c[1]}${sk===c[0]?(sd<0?" ↓":" ↑"):""}</th>`).join("")}</tr>`+
    list.map(r=>`<tr><td>${r.name}</td>${COLS.map(c=>`<td>${cell(r,c)}</td>`).join("")}</tr>`).join("")+"</table>";
  $("tc").querySelectorAll("th").forEach(th=>th.onclick=()=>{const k=th.dataset.k;st.sort=[k,st.sort[0]===k?-st.sort[1]:-1];render()});
}
function countries(p1,p2){
  const g={};for(const r of D.k){if(!keep(r[1]))continue;const o=g[r[2]]||(g[r[2]]={a:0,b:0});if(inA(r[0]))o.a+=r[3];else if(r[0]>=p1&&r[0]<=p2)o.b+=r[3]}
  const tot=Object.values(g).reduce((s,o)=>s+o.a,0);
  const list=Object.entries(g).map(([k,o])=>({name:D.ctry[k],conv:o.a,share:tot?o.a/tot:null,prev:o.b})).filter(r=>r.conv||r.prev).sort((x,y)=>y.conv-x.conv||y.prev-x.prev);TBL.tk=list;
  $("tk").innerHTML=`<table><tr><th>Country</th><th>Conv</th><th>Share</th><th>Previous period</th><th>Δ conv</th></tr><tr class="tot"><td>Total</td><td>${fmt(tot,tot%1?1:0)}</td><td></td><td>${fmt(list.reduce((s,r)=>s+r.prev,0))}</td><td></td></tr>`+
    list.map(r=>`<tr><td>${r.name}</td><td>${fmt(r.conv,r.conv%1?1:0)}</td><td>${pct(r.share)}</td><td>${fmt(r.prev)}</td><td>${dl(r.conv,r.prev,0)}</td></tr>`).join("")+"</table>";
}
document.querySelectorAll("[data-t]").forEach(b=>b.onclick=()=>{const id=b.dataset.t,l=TBL[id]||[];
  const h=id==="tk"?["name","conv","share","prev"]:["name","type","spend","conv","cpa","clk","ctr","cpc","cvr","imp","dspend","dconv","dcpa"];
  const csv=[h.join(",")].concat(l.map(r=>h.map(k=>typeof r[k]==="string"?`"${r[k].replace(/"/g,'""')}"`:(r[k]??"")).join(","))).join("\n");
  const a=document.createElement("a");a.href=URL.createObjectURL(new Blob(["﻿"+csv],{type:"text/csv"}));a.download=`openai_ads_${id==="tc"?"campaigns":"countries"}_${st.d1}_${st.d2}.csv`;a.click()});
const PER=[["1","Yesterday"],["7","7 days"],["14","14 days"],["28","28 days"],["mtd","This month"],["all","All time"]];
$("per").innerHTML=PER.map(([k,l])=>`<button data-p="${k}">${l}</button>`).join("");
$("typ").innerHTML=[["","All"]].concat(usedTypes.map(t=>[t,t])).map(([k,l])=>`<button data-ty="${k}">${l}</button>`).join("");
function setP(k){st.p=k;st.d2=LAST;st.d1=k==="mtd"?LAST.slice(0,8)+"01":k==="all"?FIRST:addD(LAST,1-+k);sync()}
function fillCamps(){$("fc").innerHTML=`<option value="">All campaigns${st.t?" · "+st.t:""}</option>`+D.camps.map((n,i)=>[n,i]).filter(([n,i])=>st.t===""||CT[i]===st.t).map(([n,i])=>`<option value="${i}">${n}</option>`).join("");$("fc").value=st.c}
function sync(){$("d1").value=st.d1;$("d2").value=st.d2;$("cm").value=st.cm;
  if(st.cm!=="custom"){const[a,b]=prev();st.c1=a;st.c2=b}$("c1").value=st.c1;$("c2").value=st.c2;document.querySelectorAll("[data-p]").forEach(b=>b.classList.toggle("on",b.dataset.p===st.p));
  document.querySelectorAll("[data-ty]").forEach(b=>b.classList.toggle("on",b.dataset.ty===st.t));render()}
document.querySelectorAll("[data-p]").forEach(b=>b.onclick=()=>setP(b.dataset.p));
document.querySelectorAll("[data-ty]").forEach(b=>b.onclick=()=>{st.t=b.dataset.ty;if(st.c!==""&&st.t!==""&&CT[+st.c]!==st.t)st.c="";fillCamps();sync()});
$("d1").onchange=e=>{st.d1=e.target.value;st.p="";sync()};$("d2").onchange=e=>{st.d2=e.target.value;st.p="";sync()};
$("fc").onchange=e=>{st.c=e.target.value;render()};
$("cm").onchange=e=>{st.cm=e.target.value;sync()};
$("c1").onchange=e=>{st.c1=e.target.value;st.cm="custom";sync()};$("c2").onchange=e=>{st.c2=e.target.value;st.cm="custom";sync()};
$("sub").textContent=`Data through ${LAST} · updated ${(D.meta.pulled_at||"").replace("T"," ").slice(0,16)} UTC · account timezone ${D.meta.timezone||"—"} · attribution ${D.meta.attribution||"—"}`;
fillCamps();setP("7");
})();
</script>
</body></html>
