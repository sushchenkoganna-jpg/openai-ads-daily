  s+=`<polyline fill="none" stroke="var(--acc2)" stroke-width="2" points="${cv.map((v,i)=>`${L+w*i+w/2},${y(v,mc)}`).join(" ")}"/></svg>`;
  $("ch1").innerHTML=s;
  const cpa=days.map(d=>{let o=z();for(let j=0;j<7;j++){const x=by[addD(d,-j)];if(x)add(o,[0,0,0,x.imp,x.clk,x.spend,x.conv])}return o.conv?o.spend/o.conv:null});
  const mx=Math.max(1,...cpa.filter(v=>v!=null))*1.1;let t=`<svg viewBox="0 0 ${W} ${H}">`;
  for(let g=0;g<=4;g++){const v=mx*g/4/1.1;t+=`<line x1="${L}" x2="${W-R}" y1="${y(v,mx)}" y2="${y(v,mx)}" stroke="var(--line)"/><text x="${L-6}" y="${y(v,mx)+3}" text-anchor="end">$${fmt(v)}</text>`}
  t+=`<polyline fill="none" stroke="var(--acc)" stroke-width="2" points="${cpa.map((v,i)=>v==null?"":`${L+w*i+w/2},${y(v,mx)}`).join(" ")}"/>`;
  cpa.forEach((v,i)=>{if(v!=null)t+=`<circle cx="${L+w*i+w/2}" cy="${y(v,mx)}" r="6" fill="transparent"><title>${days[i]}: CPA 7d ${usd(v)}</title></circle>`;t+=lbl(i)});
  $("ch2").innerHTML=t+"</svg>";
}
const COLS=[["spend","Spend",usd,0],["dspend","Δ spend",null,0],["conv","Conv",v=>fmt(v,1),0],["dconv","Δ conv",null,0],["cpa","CPA",usd,1],["dcpa","Δ CPA",null,1],
  ["clk","Clicks",v=>fmt(v),0],["ctr","CTR",pct,0],["cpc","CPC",usd,1],["cvr","CVR",pct,0],["imp","Impr.",v=>fmt(v),0]];
const TBL={};
function table(id,rows,ix,names,p1,p2){
  const g={};for(const r of rows){const k=r[ix];if(k==null)continue;const o=g[k]||(g[k]={a:z(),b:z()});
    if(r[0]>=st.d1&&r[0]<=st.d2)add(o.a,r);else if(r[0]>=p1&&r[0]<=p2)add(o.b,r)}
  let list=Object.entries(g).map(([k,o])=>{const a=der(o.a),b=der(o.b);return{name:names[k],...a,
    dspend:b.spend?a.spend/b.spend-1:null,dconv:b.conv?a.conv/b.conv-1:null,dcpa:a.cpa&&b.cpa?a.cpa/b.cpa-1:null,_b:b}}).filter(r=>r.spend||r.conv||r._b.spend);
  const [sk,sd]=st.sort[id];list.sort((x,y)=>((x[sk]??-1e18)>(y[sk]??-1e18)?1:-1)*sd);
  const T=der(list.reduce((o,r)=>{o.imp+=r.imp;o.clk+=r.clk;o.spend+=r.spend;o.conv+=r.conv;return o},z()));
  TBL[id]=list;
  const cell=(r,[k,,f,lg])=>f?f(r[k]):r[k]==null?"—":`<span class="d ${Math.abs(r[k])<.005?"":(lg?r[k]<0:r[k]>0)?"up":"dn"}">${r[k]>0?"+":""}${fmt(r[k]*100,1)}%</span>`;
  $(id).innerHTML=`<table><tr><th data-k="name">${ix===1?"Кампанія":"Країна"}</th>${COLS.map(c=>`<th data-k="${c[0]}">${c[1]}${sk===c[0]?(sd<0?" ↓":" ↑"):""}</th>`).join("")}</tr>`+
    `<tr class="tot"><td>Разом</td>${COLS.map(c=>`<td>${c[2]?c[2](T[c[0]]):""}</td>`).join("")}</tr>`+
    list.map(r=>`<tr><td>${r.name}</td>${COLS.map(c=>`<td>${cell(r,c)}</td>`).join("")}</tr>`).join("")+"</table>";
  $(id).querySelectorAll("th").forEach(th=>th.onclick=()=>{const k=th.dataset.k;st.sort[id]=[k,st.sort[id][0]===k?-st.sort[id][1]:-1];render()});
}
document.querySelectorAll("[data-t]").forEach(b=>b.onclick=()=>{const id=b.dataset.t,l=TBL[id]||[];
  const h=["name","spend","conv","cpa","clk","ctr","cpc","cvr","imp","dspend","dconv","dcpa"];
  const csv=[h.join(",")].concat(l.map(r=>h.map(k=>k==="name"?`"${String(r.name).replace(/"/g,'""')}"`:(r[k]??"")).join(","))).join("\n");
  const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([csv],{type:"text/csv"}));a.download=`openai_ads_${id==="tc"?"campaigns":"countries"}_${st.d1}_${st.d2}.csv`;a.click()});
const PER=[["1","Вчора"],["7","7 днів"],["14","14 днів"],["28","28 днів"],["mtd","Місяць"],["all","Весь час"]];
$("per").innerHTML=PER.map(([k,l])=>`<button data-p="${k}">${l}</button>`).join("");
function setP(k){st.p=k;st.d2=LAST;st.d1=k==="mtd"?LAST.slice(0,8)+"01":k==="all"?FIRST:addD(LAST,1-+k);sync()}
function sync(){$("d1").value=st.d1;$("d2").value=st.d2;document.querySelectorAll("[data-p]").forEach(b=>b.classList.toggle("on",b.dataset.p===st.p));render()}
document.querySelectorAll("[data-p]").forEach(b=>b.onclick=()=>setP(b.dataset.p));
$("d1").onchange=e=>{st.d1=e.target.value;st.p="";sync()};$("d2").onchange=e=>{st.d2=e.target.value;st.p="";sync()};
$("fc").innerHTML+=D.camps.map((n,i)=>`<option value="${i}">${n}</option>`).join("");$("fc").onchange=e=>{st.c=e.target.value;render()};
$("fk").innerHTML+=D.ctry.map((n,i)=>`<option value="${i}">${n}</option>`).join("");$("fk").onchange=e=>{st.k=e.target.value;render()};
$("fk").disabled=!D.ctry.length;
$("sub").textContent=`Дані по ${LAST} · оновлено ${(D.meta.pulled_at||"").replace("T"," ").slice(0,16)} UTC · таймзона ${D.meta.timezone||"—"} · атрибуція ${D.meta.attribution||"—"} · Conversions = тріали`;
setP("7");
</script>
